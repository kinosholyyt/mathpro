<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Менің нәтижем · MathPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&subset=cyrillic-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<!-- Деректер жүктелген соң, ortak.js осы беттің кодын (data-bet) қосады -->
<body data-bet="js/natizhe.js?v=7">
  <header id="menu"></header>

  <main class="ishki bet">
    <!-- 1. Профиль -->
    <div class="karta bolim">
      <div class="profil">
        <span class="avatar" id="avatar"></span>
        <div style="flex:1">
          <h1 style="margin:0" id="aty"></h1>
          <p class="mut" id="dengei"></p>
        </div>
      </div>
    </div>

    <!-- 2. Негізгі сандар -->
    <div class="statistika" id="sandar"></div>

    <div class="admin-tor">
      <!-- 3. Тараулар -->
      <div class="karta">
        <h2>Тараулар бойынша</h2>
        <div id="taraular"></div>
        <div id="kenes" style="margin-top:18px"></div>
      </div>

      <!-- 4. Тесттер мен ойындар -->
      <div class="karta">
        <h2>Тесттер мен ойындар</h2>
        <div id="testter"></div>
      </div>
    </div>

    <!-- 5. Белгішелер -->
    <div class="karta" style="margin-top:20px">
      <h2>Белгішелер</h2>
      <div class="belgiler" id="belgiler"></div>
    </div>
  </main>

  <!-- Firebase кітапханасы (кіру және дерекқор) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-baptau.js?v=7"></script>
  <script src="js/derekter.js?v=7"></script>
  <script src="js/ortak.js?v=7"></script>
</body>
</html>
